<html>
  <head> 
    <title>Simple-Website-prototype-Community</title>
    <link rel="stylesheet" href="./sheet.css">
    <style> 
          @import url('https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single+Ink&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
   </style>
  </head>

  <body>
    <main class="stage">
      <section class="card">
        
        <label for="name">Full Name:</label>
        <input id="name" type="text" placeholder=" ">

        <label for="email">Email:</label>
        <input id="email" type="email" placeholder=" ">

        <label for="pw">Password:</label>
        <input id="pw" type="password" placeholder=" ">

        <label for="cpw">Confirm Password:</label>
        <input id="cpw" type="password" placeholder=" ">

        <div class="actions">
          <button type="button">Sign up</button>
        </div>

      </section>
    </main>
  </body>
</html>
